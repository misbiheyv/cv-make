version: '3.8'

services:
  # Nginx reverse proxy with rate limiting
  nginx:
    image: nginx:alpine
    container_name: resume_nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ${NGINX_CONFIG_PATH}:/etc/nginx/templates/default.conf.template:ro
    environment:
      - RATE_LIMIT=${RATE_LIMIT}
      - RATE_BURST=${RATE_BURST}
      - GLOBAL_RATE_LIMIT=${GLOBAL_RATE_LIMIT}
      - GLOBAL_RATE_BURST=${GLOBAL_RATE_BURST}
      - NGINX_ENVSUBST_VARS=RATE_LIMIT,RATE_BURST,GLOBAL_RATE_LIMIT,GLOBAL_RATE_BURST
    depends_on:
      app:
        condition: service_healthy
    networks:
      - resume_network

  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: resume_app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BROWSER_POOL_MIN=${BROWSER_POOL_MIN}
      - BROWSER_POOL_MAX=${BROWSER_POOL_MAX}
      - BROWSER_POOL_IDLE_TIMEOUT_MS=${BROWSER_POOL_IDLE_TIMEOUT_MS}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    networks:
      - resume_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus
    container_name: resume_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    networks:
      - resume_network

  # Grafana dashboards
  grafana:
    image: grafana/grafana
    container_name: resume_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resume_network

  # Nginx Prometheus exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: resume_nginx_exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx:80/nginx_status'
    depends_on:
      - nginx
    networks:
      - resume_network

networks:
  resume_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
