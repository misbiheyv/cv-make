version: '3.8'

services:
  # Nginx reverse proxy with rate limiting
  nginx:
    image: nginx:alpine
    container_name: resume_nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ${NGINX_CONFIG_PATH}:/etc/nginx/conf.d/default.conf:ro
    environment:
      - RATE_LIMIT=${RATE_LIMIT}
      - RATE_BURST=${RATE_BURST}
      - NGINX_ENVSUBST_VARS=RATE_LIMIT,RATE_BURST
    depends_on:
      app:
        condition: service_healthy
    networks:
      - resume_network

  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: resume_app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - BROWSER_POOL_MIN=${BROWSER_POOL_MIN}
      - BROWSER_POOL_MAX=${BROWSER_POOL_MAX}
      - BROWSER_POOL_IDLE_TIMEOUT_MS=${BROWSER_POOL_IDLE_TIMEOUT_MS}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    networks:
      - resume_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  resume_network:
    driver: bridge
